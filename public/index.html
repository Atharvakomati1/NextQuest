<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextQuest</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>🎮 NextQuest</h1>
    <div class="header-actions">
      <input type="text" id="searchInput" placeholder="Search games...">
      <a href="/wheel.html" class="btn">🎡 Spin Wheel</a>
      <a href="/mood.html" class="btn">🎯 Mood Picker</a>
      <button class="btn btn-primary" id="addGameBtn">+ Add Game</button>
    </div>
  </header>

  <div class="filters" id="filterContainer">
    <button class="filter-btn active" data-status="">All <span id="count-all">0</span></button>
    <button class="filter-btn" data-status="backlog">Backlog <span id="count-backlog">0</span></button>
    <button class="filter-btn" data-status="playing">Playing <span id="count-playing">0</span></button>
    <button class="filter-btn" data-status="completed">Completed <span id="count-completed">0</span></button>
  </div>

  <div class="game-grid" id="gameGrid">
    <!-- Games will be injected here via JS -->
  </div>
  
  <div class="empty-state" id="emptyState" style="display: none;">
    <h3>No games found</h3>
    <p>Try adding a new game to your collection.</p>
  </div>

  <div class="stats-bar" id="statsBar">
    <div>Total: <span id="stat-total">0</span></div>
    <div>Backlog: <span id="stat-backlog">0</span></div>
    <div>Playing: <span id="stat-playing">0</span></div>
    <div>Completed: <span id="stat-completed">0</span></div>
    <div>Top Platform: <span id="stat-platform">-</span></div>
  </div>

  <!-- Add/Edit Modal -->
  <dialog id="gameModal">
    <div class="modal-header">
      <h2 id="modalTitle">Add New Game</h2>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    <form id="gameForm">
      <input type="hidden" id="gameId">
      
      <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" required>
      </div>
      
      <div class="form-group" style="display: flex; gap: 1rem;">
        <div style="flex: 1;">
          <label for="platform">Platform</label>
          <input type="text" id="platform" placeholder="e.g. PC, PS5, Switch">
        </div>
        <div style="flex: 1;">
          <label for="genre">Genre</label>
          <input type="text" id="genre" placeholder="e.g. RPG, FPS">
        </div>
      </div>
      
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status">
          <option value="backlog">Backlog</option>
          <option value="playing">Playing</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="mood_tags">Mood Tags (comma separated)</label>
        <input type="text" id="mood_tags" placeholder="chill, story, fast">
      </div>
      
      <div class="form-group">
        <label>Color Accent</label>
        <div class="color-picker" id="colorPicker">
          <!-- Colors generated by JS -->
        </div>
        <input type="hidden" id="color_tag" value="#6c63ff">
      </div>
      
      <div class="form-group">
        <label for="notes">Notes</label>
        <input type="text" id="notes">
      </div>
      
      <div class="modal-actions">
        <button type="button" class="btn" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Game</button>
      </div>
    </form>
  </dialog>

  <script src="/js/home.js"></script>
</body>
</html>
